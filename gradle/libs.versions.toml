[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "4.13.2"
# VlogClip は android.net.Uri を持つ。JVM単体テストではスタブが例外を投げるため、モックで差し替える
mockk = "1.14.11"
# JVM単体テストではAndroid標準のorg.jsonがスタブで動かないため、同じAPIの実装を使う
orgJson = "20260814"
activityCompose = "1.13.0"
kotlin = "2.4.20"
composeBom = "2026.09.00"

# 2.6.1 から更新。collectAsStateWithLifecycle と
# lifecycle.compose.LocalLifecycleOwner には 2.8.7 以上が必要。
lifecycle = "2.11.0"

# 1.2.1 から更新（1.2.1 は2024年初頭のバージョン）
media3 = "1.11.1"

# Javaパッケージが com.arthenica.ffmpegkit のままのフォークを使うこと。
# com.antonkarpenko 版はパッケージ名が異なりimportが解決できない。
ffmpegKit = "6.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# --- Compose ---
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# --- Lifecycle / ViewModel（★追加：これが無いとコンパイルできない） ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# --- Media3（★追加：プレビュー再生用。transformerは未使用なので入れない） ---
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# --- FFmpeg（16KBページサイズ対応フォーク） ---
# 使用可能なエンコーダはビルドによって異なるが、FFmpegCapabilities.kt が実行時に
# 自動判定するため、この依存を差し替えてもコード修正は不要。
# このビルドは --enable-gpl なので配布するAPKはGPLv3になる（READMEの「ライセンス」節）。
# 差し替えたら、ライセンス表示（LicenseDialog.kt・README・Releasesのソースの控え）も見直すこと。
ffmpeg-kit = { group = "com.moizhassan.ffmpeg", name = "ffmpeg-kit-16kb", version.ref = "ffmpegKit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }